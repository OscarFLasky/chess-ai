[project]
name = "chessai"
version = "0.1.0"
description = "Chess engine from scratch: policy/value network guided by MCTS"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11",
    "numpy>=1.24",
    "tqdm>=4.66",
    "zstandard>=0.22",
    "fastapi[standard]",
    "slowapi>=0.1.10",
]



[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
